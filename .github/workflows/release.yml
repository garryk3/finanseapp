name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|gamma))?$ ]]; then
            echo "Tag must look like vX.Y.Z[-beta|-gamma|-alpha]" >&2
            exit 1
          fi

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool integration_test

      - name: Analyze
        run: |
          flutter analyze --fatal-infos
          dart analyze lib --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "build_name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        # versionCode берём из pubspec (`version: X.Y.Z+N`), а не из run_number:
        # иначе релизный APK получает versionCode 1 и не ставится поверх
        # локальных сборок с большим номером (INSTALL_FAILED_VERSION_DOWNGRADE).
        run: flutter build apk --release --build-name=${{ steps.version.outputs.build_name }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: ${{ github.ref_name }}
          generate_release_notes: true