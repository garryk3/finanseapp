    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  material_ui: ^1.11.0
  signals: ^7.1.0
  signals_flutter: ^7.1.0
  go_router: ^17.4.0
  fl_chart: ^1.2.0
  drift: ^2.34.3
