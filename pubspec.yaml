name: finanseapp
description: "FinanseApp — учёт личных финансов (offline-first, Android 12+, Material 3, RU)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  material_ui: ^1.11.0
  signals: ^7.1.0
  signals_flutter: ^7.1.0
  go_router: ^17.4.0
  fl_chart: ^1.2.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  intl: ^0.20.2
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1
  mocktail: ^1.0.5

flutter:
  generate: true
  uses-material-design: true
